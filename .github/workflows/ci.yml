name: CI

on:
  push:
    branches: [ main, lab1 ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gcovr

      - name: Configure CMake
        working-directory: lab1/markov
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug -DENABLE_COVERAGE=ON

      - name: Build
        working-directory: lab1/markov
        run: cmake --build build --target markov_tests

      - name: Run tests
        working-directory: lab1/markov
        run: ./build/markov_tests

      - name: Generate coverage
        working-directory: lab1/markov
        run: |
          gcovr --root . --filter 'src/' --exclude 'tests/' --print-summary --txt-metric line --txt

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install cppcheck
        run: sudo apt-get install -y cppcheck

      - name: Run cppcheck
        working-directory: lab1/markov
        run: cppcheck --enable=warning,performance,portability --suppress=missingIncludeSystem --suppress=missingInclude -I include --error-exitcode=1 src/

  release:
    name: Release
    runs-on: ubuntu-latest
    needs: [build-and-test, lint]
    if: startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++

      - name: Configure CMake
        working-directory: lab1/markov
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        working-directory: lab1/markov
        run: cmake --build build --target markov

      - name: Package artifact
        working-directory: lab1/markov
        run: |
          mkdir -p artifact
          cp build/markov artifact/
          cp Doxyfile artifact/
          tar -czf markov-linux.tar.gz artifact/

      - name: Upload to Release
        uses: softprops/action-gh-release@v1
        with:
          files: lab1/markov/markov-linux.tar.gz
